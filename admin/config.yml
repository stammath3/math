# Ρυθμίσεις της σελίδας διαχείρισης (/admin)
backend:
  name: github
  repo: stammath3/math
  branch: main
  commit_messages:
    update: "Ενημέρωση: {{path}}"
    uploadMedia: "Νέο αρχείο: {{path}}"

media_folder: uploads
public_folder: uploads

collections:
  - name: notes
    label: "Σημειώσεις"
    files:
      - name: notes
        label: "Σημειώσεις"
        file: content/notes.json
        format: json
        fields:
          - name: items
            label: "Σημειώσεις"
            label_singular: "σημειώσεις"
            widget: list
            add_to_top: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - { name: title, label: "Τίτλος", widget: string }
              - { name: date, label: "Ημερομηνία", widget: datetime, time_format: false, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY" }
              - { name: file, label: "Αρχείο (PDF, Word, φωτογραφία)", widget: file }

  - name: videos
    label: "Βίντεο"
    files:
      - name: videos
        label: "Βίντεο"
        file: content/videos.json
        format: json
        fields:
          - name: items
            label: "Βίντεο"
            label_singular: "βίντεο"
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Τίτλος", widget: string }
              - { name: link, label: "Σύνδεσμος YouTube", widget: string, hint: "Αντέγραψε το link από το YouTube (κουμπί «Κοινοποίηση»)." }

  - name: games
    label: "Παιχνίδια"
    files:
      - name: games
        label: "Παιχνίδια"
        file: content/games.json
        format: json
        fields:
          - name: items
            label: "Παιχνίδια"
            label_singular: "παιχνίδι"
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Τίτλος", widget: string }
              - { name: file, label: "Αρχείο παιχνιδιού (.html)", widget: file }
