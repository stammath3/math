<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Μαθηματικά</title>
  <meta name="description" content="Σημειώσεις, βίντεο και παιχνίδια μαθηματικών.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='serif'%3E%CF%80%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">π</span>
        <span>Μαθηματικά</span>
      </a>
      <nav class="nav" aria-label="Ενότητες">
        <a href="#simeioseis">Σημειώσεις</a>
        <a href="#vinteo">Βίντεο</a>
        <a href="#paixnidia">Παιχνίδια</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="section" id="simeioseis">
      <h2><span class="dot t-notes"></span>Σημειώσεις</h2>
      <ul class="list" id="notes"></ul>
    </section>

    <section class="section" id="vinteo">
      <h2><span class="dot t-video"></span>Βίντεο</h2>
      <ul class="list" id="videos"></ul>
    </section>

    <section class="section" id="paixnidia">
      <h2><span class="dot t-game"></span>Παιχνίδια</h2>
      <ul class="list" id="games"></ul>
    </section>
  </main>

  <dialog id="video-dialog" aria-label="Βίντεο">
    <div class="dialog-head">
      <strong id="video-title"></strong>
      <button class="icon-btn" id="video-close" aria-label="Κλείσιμο">✕</button>
    </div>
    <div class="video-frame"><iframe id="video-iframe" title="Βίντεο" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
